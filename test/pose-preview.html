<!doctype html>
<meta charset="utf-8">
<title>Creepy Peeper — pose preview</title>
<!-- Renders the real camera builder from src/content.js, every brand at fixed
     poses, so the 3D artwork can be eyeballed without installing the extension.
     Serve the REPO ROOT: python3 -m http.server 8765 -->
<style>
  body { margin:0; font:13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; }
  .band { padding:18px 18px 26px; }
  .light { background:#f6f7f9; color:#1b1f27; }
  .dark  { background:#14171d; color:#e8ebf0; }
  h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; opacity:.6;
       margin:0 0 6px; font-weight:600; }
  h3 { font-size:12px; margin:14px 0 8px; font-weight:600; opacity:.85; }
  .grid { display:flex; flex-wrap:wrap; gap:10px; }
  .cell { width:210px; height:190px; position:relative;
          border:1px dashed rgba(128,140,160,.45); border-radius:8px; }
  .cell .label { position:absolute; left:8px; bottom:6px; font-size:11px;
                 font-variant-numeric:tabular-nums; opacity:.65; }
  .anchor { position:absolute; top:72px; right:72px; width:0; height:0; }
</style>
<div class="band light"><h2>light page</h2><div id="l"></div></div>
<div class="band dark"><h2>dark page</h2><div id="d"></div></div>
<script type="module">
const src = await (await fetch("/src/content.js?t=" + Date.now())).text();
const cut = (a, b) => src.slice(src.indexOf(a), src.indexOf(b));
const code =
  cut("  var F_MARK =", "  function trackerById") +
  cut("  var PIVOT_RIGHT", "  // ------------------------------------------------------------------ cameras") +
  "\nreturn { SHADOW_CSS, buildMount, buildHead, TRACKERS, REST_YAW, REST_LEAN };";
const m = new Function(code)();

const poses = [
  ["rest", m.REST_YAW, m.REST_LEAN],
  ["leaning", 135, -58],
  ["below", 92, -26],
  ["far left", 178, -18],
  ["face-on", 135, -84],
  // face-on across the yaw range: the lens highlight must not drift between these
  ["face-on 40", 40, -84],
  ["face-on 210", 210, -84],
];

for (const id of ["l", "d"]) {
  const band = document.getElementById(id);
  for (const tracker of m.TRACKERS) {
    const h = document.createElement("h3");
    h.textContent = tracker.id;
    band.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "grid";
    band.appendChild(grid);
    for (const [name, yaw, lean] of poses) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const anchor = document.createElement("div");
      anchor.className = "anchor";
      const root = anchor.attachShadow({ mode: "open" });
      const sheet = new CSSStyleSheet();
      sheet.replaceSync(m.SHADOW_CSS);
      root.adoptedStyleSheets = [sheet];
      // same layering as the extension: mount behind, head in front
      root.appendChild(m.buildMount());
      root.appendChild(m.buildHead(tracker));
      anchor.style.setProperty("--cp-band", tracker.band);
      anchor.style.setProperty("--cp-stops", tracker.stops);
      anchor.style.setProperty("--cp-yaw", yaw + "deg");
      anchor.style.setProperty("--cp-lean", lean + "deg");
      cell.appendChild(anchor);
      const label = document.createElement("div");
      label.className = "label";
      label.textContent = `${name} · ${yaw}° / ${lean}°`;
      cell.appendChild(label);
      grid.appendChild(cell);
    }
  }
}
document.title = "ready";
</script>
