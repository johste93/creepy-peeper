<svg xmlns="http://www.w3.org/2000/svg" viewBox="7 -7 82 82" width="128" height="128">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#f1f5fa"/>
      <stop offset="1" stop-color="#b4c2d6"/>
    </linearGradient>
    <!-- The band is a recording-light red rather than any company's colour.
         The toolbar icon stands for the extension, not for one tracker. -->
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b5e"/>
      <stop offset=".5" stop-color="#e8382a"/>
      <stop offset="1" stop-color="#9c1a10"/>
    </linearGradient>
    <radialGradient id="glass" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#6d8099"/>
      <stop offset=".38" stop-color="#222d3a"/>
      <stop offset="1" stop-color="#05080d"/>
    </radialGradient>
    <clipPath id="bodyclip"><rect x="40" y="13" width="40" height="22" rx="11"/></clipPath>
  </defs>

  <!-- one dark silhouette behind everything, so the white body reads on any toolbar -->
  <g fill="#1b2432" stroke="#1b2432" stroke-width="5" stroke-linejoin="round"
     stroke-linecap="round">
    <rect x="66" y="4" width="20" height="10" rx="3"/>
    <path d="M72 12 L50 24" fill="none" stroke-width="11"/>
    <g transform="rotate(135 50 24)">
      <rect x="40" y="13" width="40" height="22" rx="11"/>
      <rect x="77" y="10" width="10" height="28" rx="4"/>
      <ellipse cx="88" cy="24" rx="4.5" ry="12.5"/>
    </g>
    <circle cx="50" cy="24" r="7"/>
  </g>

  <!-- mount -->
  <rect x="66" y="4" width="20" height="10" rx="3" fill="url(#shell)"/>
  <path d="M72 12 L50 24" fill="none" stroke="url(#shell)" stroke-width="7"
        stroke-linecap="round"/>

  <circle cx="50" cy="24" r="7" fill="url(#shell)"/>

  <!-- head -->
  <g transform="rotate(135 50 24)">
    <rect x="40" y="13" width="40" height="22" rx="11" fill="url(#shell)"/>
    <g clip-path="url(#bodyclip)">
      <rect x="40" y="13" width="18" height="22" fill="url(#band)"/>
    </g>
    <rect x="77" y="10" width="10" height="28" rx="4" fill="url(#shell)"/>
    <ellipse cx="88" cy="24" rx="4.5" ry="12.5" fill="url(#glass)"/>
    <ellipse cx="87" cy="18.5" rx="1.5" ry="3.4" fill="#fff" opacity=".7"/>
    <circle cx="64" cy="16" r="2" fill="#ff3b30"/>
  </g>

</svg>
